[project]
name = "delhi-transit-planner"
version = "1.0.0"
description = "Delhi Transit Common-Lines RAPTOR Journey Planner & Live Anomaly Router"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=4.25.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
]

[tool.vercel]
entrypoint = "src.api.app:app"
